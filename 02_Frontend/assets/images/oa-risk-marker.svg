<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Educational knee osteoarthritis risk marker illustration</title>
<desc id="desc">Schematic knee joint showing areas commonly considered as osteoarthritis risk markers, including joint-space change, load imbalance and movement-related symptoms.</desc>
<defs>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e5e7eb"/><stop offset="1" stop-color="#b8c0c9"/></linearGradient>
  <linearGradient id="bone2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dbe1e6"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#aeb8c2"/></linearGradient>
  <linearGradient id="cartilage" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35b7a5"/><stop offset=".5" stop-color="#8de0d4"/><stop offset="1" stop-color="#258f86"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#19323a" flood-opacity=".15"/></filter>
</defs>
<rect width="720" height="430" rx="28" fill="#f3f8f8"/>
<ellipse cx="360" cy="370" rx="235" ry="28" fill="#d8e5e6" opacity=".65"/>
<!-- femur -->
<path d="M285 45 C310 20 360 18 389 48 C410 70 405 112 397 150 L386 206 C380 232 358 245 333 238 C310 231 298 210 300 185 L308 125 C311 98 278 79 285 45Z" fill="url(#bone)" filter="url(#shadow)"/>
<!-- tibia -->
<path d="M292 238 C315 222 350 222 379 239 C401 252 407 278 399 302 L383 356 C377 378 356 389 330 384 L274 372 C251 367 241 346 247 325 L264 267 C269 253 278 245 292 238Z" fill="url(#bone2)" filter="url(#shadow)"/>
<!-- cartilage / joint space -->
<path d="M292 225 C316 213 366 214 392 228 C383 244 365 253 343 252 C321 251 304 242 292 225Z" fill="url(#cartilage)" opacity=".92"/>
<path d="M286 255 C311 267 365 271 398 253" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-dasharray="9 9"/>
<!-- marker callouts -->
<g font-family="Arial, sans-serif">
 <line x1="397" y1="226" x2="560" y2="156" stroke="#0f766e" stroke-width="3"/>
 <circle cx="397" cy="226" r="7" fill="#0f766e"/>
 <rect x="548" y="112" width="142" height="66" rx="14" fill="#fff" stroke="#b9dcd8"/>
 <text x="566" y="137" font-size="13" font-weight="700" fill="#17343a">Joint-space</text><text x="566" y="157" font-size="13" fill="#52686b">change marker</text>
 <line x1="268" y1="302" x2="105" y2="260" stroke="#f59e0b" stroke-width="3"/>
 <circle cx="268" cy="302" r="7" fill="#f59e0b"/>
 <rect x="22" y="224" width="148" height="66" rx="14" fill="#fff" stroke="#f1d99d"/>
 <text x="40" y="249" font-size="13" font-weight="700" fill="#17343a">Load imbalance</text><text x="40" y="269" font-size="13" fill="#52686b">screening marker</text>
 <line x1="331" y1="354" x2="495" y2="348" stroke="#64748b" stroke-width="3"/>
 <circle cx="331" cy="354" r="7" fill="#64748b"/>
 <rect x="480" y="316" width="208" height="66" rx="14" fill="#fff" stroke="#d5dce3"/>
 <text x="498" y="341" font-size="13" font-weight="700" fill="#17343a">Movement symptoms</text><text x="498" y="361" font-size="13" fill="#52686b">clinical input marker</text>
 <text x="28" y="46" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">EDUCATIONAL SCREENING VISUAL</text>
</g>
</svg>
